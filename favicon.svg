<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="akGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3368A0" />
      <stop offset="100%" stop-color="#1B3B5F" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C8DFDB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#66A3BF" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer squircle container -->
  <rect width="64" height="64" rx="16" fill="url(#akGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#66A3BF" stroke-opacity="0.4" stroke-width="1.5" />
  
  <!-- AK Monogram -->
  <text 
    x="32" 
    y="40.5" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', monospace" 
    font-size="25" 
    font-weight="800" 
    letter-spacing="-1.5"
    fill="url(#textGrad)" 
    text-anchor="middle"
    filter="url(#glow)">AK</text>
    
  <!-- Small accent indicator dot -->
  <circle cx="50" cy="22" r="3" fill="#66A3BF" />
</svg>